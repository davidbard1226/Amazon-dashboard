<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Buybox Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .stat-card p {
            font-size: 32px;
            font-weight: bold;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        input {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button.danger {
            background: #dc3545;
        }
        
        button.danger:hover {
            background: #c82333;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .product-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .product-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .product-info {
            margin: 10px 0;
            font-size: 13px;
        }
        
        .product-info strong {
            display: inline-block;
            width: 100px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .status-winning {
            background: #28a745;
            color: white;
        }
        
        .status-losing {
            background: #dc3545;
            color: white;
        }
        
        .product-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        
        .product-actions button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }
        
        .progress {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background: #28a745;
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Amazon Buybox Dashboard</h1>
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Products</h3>
                    <p id="totalProducts">0</p>
                </div>
                <div class="stat-card">
                    <h3>Winning</h3>
                    <p id="winningCount">0</p>
                </div>
                <div class="stat-card">
                    <h3>Losing</h3>
                    <p id="losingCount">0</p>
                </div>
                <div class="stat-card">
                    <h3>Win Rate</h3>
                    <p id="winRate">0%</p>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="asinInput" placeholder="ASIN (e.g., B08N5WRWNW)">
                <input type="text" id="titleInput" placeholder="Title (optional)">
                <input type="text" id="skuInput" placeholder="SKU (optional)">
                <input type="number" id="myPriceInput" placeholder="Your Price" step="0.01">
                <input type="number" id="stockInput" placeholder="Stock (optional)">
            </div>
            <div class="input-group">
                <button onclick="addProduct()">➕ Add Product</button>
                <button onclick="refreshAll()">🔄 Refresh All</button>
                <button onclick="clearAll()" class="danger">🗑️ Clear All</button>
            </div>
            <div class="progress" id="progressContainer">
                <div class="progress-bar" id="progressBar">0%</div>
            </div>
        </div>

        <div class="products-grid" id="productsGrid"></div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        
        // Try to load from ANY localStorage key
        function loadProducts() {
            const keys = ['amazonProducts', 'products', 'buyboxProducts', 'scrapedProducts'];
            for (const key of keys) {
                const data = localStorage.getItem(key);
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        if (Object.keys(parsed).length > 0) {
                            console.log(`✅ Loaded ${Object.keys(parsed).length} products from: ${key}`);
                            return parsed;
                        }
                    } catch (e) {
                        console.error(`Failed to parse ${key}:`, e);
                    }
                }
            }
            return {};
        }
        
        let allProducts = loadProducts();

        // Save to default key
        function saveProducts() {
            localStorage.setItem('amazonProducts', JSON.stringify(allProducts));
        }

        function renderAll() {
            // Update stats
            const total = Object.keys(allProducts).length;
            let winning = 0;
            let losing = 0;

            Object.values(allProducts).forEach(prod => {
                const last = prod.last || (prod.points && prod.points.length ? prod.points[prod.points.length - 1] : null);
                if (!last) return;
                
                const isBonolo = last.seller && last.seller.toLowerCase().includes('bonolo');
                if (isBonolo) winning++;
                else losing++;
            });

            document.getElementById('totalProducts').textContent = total;
            document.getElementById('winningCount').textContent = winning;
            document.getElementById('losingCount').textContent = losing;
            document.getElementById('winRate').textContent = total > 0 ? ((winning / total * 100).toFixed(1) + '%') : '0%';

            // Render product cards
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            Object.entries(allProducts).forEach(([asin, prod]) => {
                const last = prod.last || (prod.points && prod.points.length ? prod.points[prod.points.length - 1] : null);
                const isBonolo = last && last.seller && last.seller.toLowerCase().includes('bonolo');

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <h3>${prod.title || 'Loading...'}</h3>
                    <div class="product-info"><strong>ASIN:</strong> ${asin}</div>
                    ${prod.sku ? `<div class="product-info"><strong>SKU:</strong> ${prod.sku}</div>` : ''}
                    <div class="product-info"><strong>Seller:</strong> ${last ? last.seller : 'N/A'}</div>
                    <div class="product-info"><strong>Price:</strong> R${last && last.price ? last.price.toFixed(2) : 'N/A'}</div>
                    ${prod.myPrice ? `<div class="product-info"><strong>Your Price:</strong> R${prod.myPrice.toFixed(2)}</div>` : ''}
                    ${prod.stock !== null && prod.stock !== undefined ? `<div class="product-info"><strong>Stock:</strong> ${prod.stock}</div>` : ''}
                    <span class="status-badge ${isBonolo ? 'status-winning' : 'status-losing'}">
                        ${isBonolo ? '🏆 WINNING' : '⚠️ LOSING'}
                    </span>
                    <div class="product-actions">
                        <button onclick="scrapeASIN('${asin}')">🔄 Refresh</button>
                        <button onclick="deleteProduct('${asin}')" class="danger">Delete</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (grid.children.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No products yet. Add one above!</p>';
            }
        }

        async function addProduct() {
            const asin = document.getElementById('asinInput').value.trim();
            if (!asin) return alert('Please enter an ASIN');

            allProducts[asin] = {
                asin: asin,
                title: document.getElementById('titleInput').value.trim() || 'Loading...',
                sku: document.getElementById('skuInput').value.trim() || '',
                myPrice: parseFloat(document.getElementById('myPriceInput').value) || null,
                stock: parseInt(document.getElementById('stockInput').value) || null,
                points: [],
                last: null
            };

            saveProducts();
            renderAll();

            // Clear inputs
            document.getElementById('asinInput').value = '';
            document.getElementById('titleInput').value = '';
            document.getElementById('skuInput').value = '';
            document.getElementById('myPriceInput').value = '';
            document.getElementById('stockInput').value = '';

            await scrapeASIN(asin);
        }

        async function scrapeASIN(asin) {
            const urls = [
                `https://www.amazon.co.za/dp/${asin}`,
                `https://www.amazon.co.za/gp/offer-listing/${asin}`
            ];

            for (const url of urls) {
                try {
                    const response = await fetch(`${API_BASE}/proxy?url=${encodeURIComponent(url)}`);
                    const html = await response.text();
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Extract title
                    const titleEl = doc.querySelector('#productTitle, h1.a-size-large');
                    if (titleEl && allProducts[asin].title === 'Loading...') {
                        allProducts[asin].title = titleEl.textContent.trim();
                    }

                    // Extract seller
                    let seller = 'N/A';
                    const sellerEl = doc.querySelector('#merchant-info, #sellerProfileTriggerId, .tabular-buybox-text');
                    if (sellerEl) {
                        const text = sellerEl.textContent;
                        if (text.includes('Bonolo') || text.includes('bonolo')) {
                            seller = 'Bonolo Online';
                        } else {
                            const match = text.match(/Sold by\s+([^.]+)/i) || text.match(/([A-Za-z\s]+)/);
                            if (match) seller = match[1].trim();
                        }
                    }

                    // Extract price
                    let price = null;
                    const priceEl = doc.querySelector('.a-price .a-offscreen, #priceblock_ourprice, .a-price-whole');
                    if (priceEl) {
                        const priceText = priceEl.textContent.replace(/[^0-9.,]/g, '');
                        price = parseFloat(priceText.replace(',', ''));
                    }

                    // Save data
                    const dataPoint = {
                        timestamp: new Date().toISOString(),
                        seller: seller,
                        price: price,
                        url: url
                    };

                    if (!allProducts[asin].points) allProducts[asin].points = [];
                    allProducts[asin].points.push(dataPoint);
                    allProducts[asin].last = dataPoint;
                    
                } catch (error) {
                    console.error(`Error scraping ${url}:`, error);
                }
            }

            saveProducts();
            renderAll();
        }

        async function refreshAll() {
            const asins = Object.keys(allProducts);
            if (asins.length === 0) return alert('No products to refresh');

            document.getElementById('progressContainer').style.display = 'block';
            
            for (let i = 0; i < asins.length; i++) {
                await scrapeASIN(asins[i]);
                const pct = Math.round(((i + 1) / asins.length * 100));
                document.getElementById('progressBar').style.width = pct + '%';
                document.getElementById('progressBar').textContent = pct + '%';
                await new Promise(r => setTimeout(r, 500));
            }

            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
            alert(`✅ Refreshed all ${asins.length} products!`);
        }

        function deleteProduct(asin) {
            if (!confirm(`Delete product ${asin}?`)) return;
            delete allProducts[asin];
            saveProducts();
            renderAll();
        }

        function clearAll() {
            if (!confirm('Delete all products?')) return;
            allProducts = {};
            localStorage.removeItem('amazonProducts');
            renderAll();
        }

        // Initialize
        renderAll();
    </script>
</body>
</html>
